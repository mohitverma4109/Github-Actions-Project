name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:

  Compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml


  Security-scan:   # ✅ Now separate job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - name: Trivy-Installation
        run: |
          sudo apt-get install wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install trivy -y

      - name: Run Trivy scan
        run: |
          trivy fs --format json -o trivy-report.json .

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Git-leaks installation
        run: sudo apt install gitleaks -y

      - name: git-leaks-scan
        run: |
          gitleaks detect --source . --report-path gitleaks-report.json --report-format json

      - name: Convert Gitleaks JSON to HTML
        run: |
          sudo apt-get install jq -y
          echo "<html><body><h1>Gitleaks Report</h1><pre>" > gitleaks-report.html
          cat gitleaks-report.json >> gitleaks-report.html
          echo "</pre></body></html>" >> gitleaks-report.html

      - name: Upload Gitleaks JSON report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      - name: Upload Gitleaks HTML report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-html-report
          path: gitleaks-report.html
    
  
      

    
